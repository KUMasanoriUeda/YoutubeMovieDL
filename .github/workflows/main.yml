name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name YoutubeMovieDL moviedl.py

      - name: Create release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          @"
          ## ffmpeg

          ffmpegは以下からダウンロードしてください。

          https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip

          zipを展開し、bin/ffmpeg.exeをYoutubeMovieDL.exeと同じフォルダに置いてください。
          "@ | Out-File release-notes.md -Encoding utf8

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YoutubeMovieDL.exe
          body_path: release-notes.md

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeMovieDL-windows
          path: dist/YoutubeMovieDL.exe
